[project]
name = "adengine-ai"
version = "0.1.0"
description = "Autonomous creative-first ad deployment and optimization for Meta and Google (YouTube)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "google-ads>=24.0.0",
    "cryptography>=43.0",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
